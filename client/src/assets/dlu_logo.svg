<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="dluBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B5394" />
      <stop offset="100%" stop-color="#002D62" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F2B705" />
    </linearGradient>
    <path id="textPathTop" d="M 30,100 A 70,70 0 0,1 170,100" />
    <path id="textPathBottom" d="M 170,100 A 70,70 0 0,1 30,100" />
  </defs>

  <!-- Vành ngoài đỏ/navy truyền thống DLU -->
  <circle cx="100" cy="100" r="96" fill="#C8102E" stroke="#F2B705" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="#003366" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Chữ tròn trên: TRƯỜNG ĐẠI HỌC ĐÀ LẠT -->
  <text fill="#FFFFFF" font-size="12" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="900" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      TRƯỜNG ĐẠI HỌC ĐÀ LẠT
    </textPath>
  </text>

  <!-- Chữ tròn dưới: DALAT UNIVERSITY • 1957 -->
  <text fill="#F2B705" font-size="10.5" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="800" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      DALAT UNIVERSITY • 1957
    </textPath>
  </text>

  <!-- Vòng tròn tâm xanh Đà Lạt -->
  <circle cx="100" cy="100" r="66" fill="url(#dluBg)" stroke="#F2B705" stroke-width="2.5" />

  <!-- Họa tiết tia sáng / mặt trời tri thức & đồi thông xanh -->
  <path d="M 60,115 C 75,95, 125,95, 140,115 L 140,135 C 120,140, 80,140, 60,135 Z" fill="#007A3D" opacity="0.85" />
  <path d="M 45,125 C 65,110, 135,110, 155,125 L 155,140 C 130,145, 70,145, 45,140 Z" fill="#005A2B" opacity="0.9" />

  <!-- Tháp biểu tượng Viện Đại học Đà Lạt (Kiến trúc Nhà Tròn/Tháp Chùa DLU) -->
  <path d="M 96,48 L 104,48 L 104,82 L 96,82 Z" fill="#FFFFFF" />
  <polygon points="100,38 93,48 107,48" fill="#F2B705" />
  <path d="M 90,82 L 110,82 L 114,115 L 86,115 Z" fill="#FFFFFF" stroke="#003366" stroke-width="1" />
  <rect x="94" y="86" width="12" height="18" rx="6" fill="#003366" />
  <rect x="97" y="89" width="6" height="12" rx="3" fill="#F2B705" />

  <!-- Cây thông Đà Lạt 2 bên -->
  <!-- Thông trái -->
  <polygon points="75,85 70,96 80,96" fill="#00A859" />
  <polygon points="75,93 68,106 82,106" fill="#008844" />
  <polygon points="75,103 65,118 85,118" fill="#006633" />
  <rect x="73.5" y="118" width="3" height="6" fill="#654321" />

  <!-- Thông phải -->
  <polygon points="125,85 120,96 130,96" fill="#00A859" />
  <polygon points="125,93 118,106 132,106" fill="#008844" />
  <polygon points="125,103 115,118 135,118" fill="#006633" />
  <rect x="123.5" y="118" width="3" height="6" fill="#654321" />

  <!-- Quyển sách mở màu trắng - Tri thức & Khai phóng -->
  <path d="M 64,120 C 82,114, 98,118, 100,125 C 102,118, 118,114, 136,120 L 136,136 C 118,130, 102,134, 100,141 C 98,134, 82,130, 64,136 Z" fill="#FFFFFF" stroke="#002D62" stroke-width="1.5" />
  <line x1="100" y1="125" x2="100" y2="141" stroke="#002D62" stroke-width="2" />
  <line x1="72" y1="125" x2="92" y2="123" stroke="#003366" stroke-width="1.2" opacity="0.6" />
  <line x1="72" y1="129" x2="92" y2="127" stroke="#003366" stroke-width="1.2" opacity="0.6" />
  <line x1="108" y1="123" x2="128" y2="125" stroke="#003366" stroke-width="1.2" opacity="0.6" />
  <line x1="108" y1="127" x2="128" y2="129" stroke="#003366" stroke-width="1.2" opacity="0.6" />

  <!-- Ngôi sao vàng dẫn đường tri thức -->
  <polygon points="100,24 102.5,30 109,30 104,34 106,40 100,36 94,40 96,34 91,30 97.5,30" fill="url(#goldGrad)" />
</svg>
